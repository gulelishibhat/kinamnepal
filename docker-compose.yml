version: '3.9'

services:
  # ─── PostgreSQL ────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: mkelectric_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mkelectric
      POSTGRES_PASSWORD: mkelectric123
      POSTGRES_DB: mkelectricshop
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mkelectric -d mkelectricshop']
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── MinIO (S3-compatible object storage) ──────────────────
  minio:
    image: minio/minio:latest
    container_name: mkelectric_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - '9000:9000'   # API
      - '9001:9001'   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── MinIO bucket init ─────────────────────────────────────
  minio-init:
    image: minio/mc:latest
    container_name: mkelectric_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin123 &&
        mc mb --ignore-existing local/mkelectric-media &&
        mc anonymous set download local/mkelectric-media &&
        echo 'MinIO bucket ready'
      "

volumes:
  postgres_data:
  minio_data:
